name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Secret Hygiene
        run: |
          echo "Scanning for exposed OpenAI private keys..."
          # Fail if any line contains an active pattern of sk- followed by 20+ alphanumeric chars (excluding dummy test strings)
          if grep -rnE "sk-[A-Za-z0-9]{30,}" app/ tests/ | grep -v "sk-test"; then
            echo "ERROR: Potential OpenAI API Key detected in repository code!"
            exit 1
          fi
          echo "No secrets detected."

      - name: Syntax and Import Validation
        run: |
          python -m compileall app/ tests/
          python -c "import app.main; print('FastAPI imported successfully')"

      - name: Run Pytest Suite
        env:
          OPENAI_API_KEY: "sk-test"
          SEMANTIC_CACHE_ENABLED: "true"
          LLM_ROUTING_ENABLED: "true"
          HYBRID_SEARCH_ENABLED: "true"
          API_KEY_AUTH_ENABLED: "false"
        run: |
          pytest -v --durations=10

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: rag-backend:latest

      - name: Build Streamlit Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.streamlit
          push: false
          tags: rag-frontend:latest
